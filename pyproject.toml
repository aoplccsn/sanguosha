[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanguosha"
version = "0.1.0"
description = "Five-player identity mode card game"
requires-python = ">=3.12"
dependencies = ["PySide6-Essentials>=6.7", "websockets>=12,<16", "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "PyInstaller>=6.10", "httpx>=0.27,<1"]
gui = ["PySide6>=6.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
